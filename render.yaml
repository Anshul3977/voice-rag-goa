# Render Blueprint for the free web service.
# Secret values are not stored here. GROQ_API_KEY is entered once in the Dashboard.
services:
  - type: web
    name: voice-rag-goa
    runtime: python
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GENERATION_MODEL
        value: llama-3.3-70b-versatile
      - key: STT_MODEL
        value: whisper-large-v3-turbo
      - key: DATA_DIR
        value: data/store
      - key: WARM_START
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
